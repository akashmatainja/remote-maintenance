{% extends "base.html" %}
{% block content %}
<h2 class="page-title">Session {{ session_id }}</h2>
<table class="list">
  <thead><tr><th>Time</th><th>Event</th><th>Details</th></tr></thead>
  <tbody>
  {% for e in events %}
    <tr><td class="started" data-ts="{{ e.at }}"></td><td>{{ e.kind }}</td>
        <td>{% for k, v in e.payload.items() %}{{ k }}: {{ v }}{% if not loop.last %}, {% endif %}{% endfor %}</td></tr>
  {% endfor %}
  </tbody>
</table>
<script>document.querySelectorAll(".started").forEach(td => td.textContent = new Date(td.dataset.ts * 1000).toLocaleTimeString());</script>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h2 class="page-title">Start a remote session</h2>
{% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
<div class="cards">
  <form class="panel" id="start-form" novalidate>
    <h2>New session (expert)</h2>
    <div class="form-row"><label for="exp-name">Your name</label><input id="exp-name" placeholder="R. Banerjee" aria-describedby="exp-name-err"><p class="field-error" id="exp-name-err" hidden></p></div>
    <div class="form-row"><label for="exp-room">Room code</label><input id="exp-room" placeholder="Leave empty to create one" aria-describedby="exp-room-err"><p class="field-error" id="exp-room-err" hidden></p></div>
    <button class="btn-primary" type="submit">Start session</button>
    <p class="hint">You will get a link to send to the technician.</p>
  </form>
  <form class="panel" id="join-form" novalidate>
    <h2>Join (technician)</h2>
    <div class="form-row"><label for="tech-name">Your name or device</label><input id="tech-name" placeholder="Line-4 Handheld" aria-describedby="tech-name-err"><p class="field-error" id="tech-name-err" hidden></p></div>
    <div class="form-row"><label for="tech-room">Room code</label><input id="tech-room" placeholder="7K42QX" aria-describedby="tech-room-err"><p class="field-error" id="tech-room-err" hidden></p></div>
    <button class="btn-primary" type="submit">Join with camera</button>
  </form>
</div>

<h2 class="page-title">Recent sessions</h2>
{% include "_sessions_table.html" %}

<script>
const go = (room, role, name) => location.href = `/remote-camera?${new URLSearchParams({room, role, name})}`;
const $id = (id) => document.getElementById(id);
function fieldError(id, msg) {
  const input = $id(id), err = $id(id + "-err");
  err.textContent = msg || "";
  err.hidden = !msg;
  input.setAttribute("aria-invalid", msg ? "true" : "false");
  if (msg) input.focus();
  return !msg;
}
const roomProblem = (v) => v.replace(/[^a-z0-9]/gi, "").length < 4 ? "Room codes have at least 4 letters or numbers, like 7K42QX." : "";

$id("start-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $id("exp-name").value.trim();
  let room = $id("exp-room").value.trim();
  if (!fieldError("exp-name", name ? "" : "Enter your name so the technician knows who is guiding them.")) return;
  if (room && !fieldError("exp-room", roomProblem(room))) return;
  fieldError("exp-room", "");
  if (!room) {
    try { room = (await (await fetch("/api/rooms", { method: "POST" })).json()).room; }
    catch { return fieldError("exp-room", "Couldn't create a room. Check your connection and try again."); }
  }
  go(room, "expert", name);
});
$id("join-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $id("tech-name").value.trim(), room = $id("tech-room").value.trim();
  if (!fieldError("tech-name", name ? "" : "Enter your name or the device name, e.g. Line-4 Handheld.")) return;
  if (!fieldError("tech-room", room ? roomProblem(room) : "Enter the room code the expert sent you.")) return;
  go(room, "technician", name);
});
</script>
{% endblock %}
